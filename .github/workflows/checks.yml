name: Check local examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r pdf-watermark/requirements.txt
      - run: python tools/validate_templates.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s pdf-watermark/tests -v
      - run: node apps-script-monitoring/tests/monitoring_helpers.test.cjs
